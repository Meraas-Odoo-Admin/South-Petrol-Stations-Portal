<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Keep in sync with APP_NAME in src/lib/appInfo.ts — index.html is
         static and can't import a JS constant for its own <title>. -->
    <title>ضبط الوقود</title>
    <!-- Registration pivot, phase 3: the «ضبط الوقود» symbol as favicon, and
         a web app manifest so station phones can "Add to home screen" as a
         full-screen app. No service worker / offline caching on purpose —
         the app needs a live connection for every fill-up anyway. -->
    <link rel="icon" type="image/svg+xml" href="/brand/dabt-alwaqud-favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/app-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D5C52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ضبط الوقود" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
