server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every non-file, non-/api path is owned by
    # react-router's client-side routing, not a real file on disk.
    location / {
        try_files $uri /index.html;
    }

    # Reverse-proxies the API through this same origin, so:
    #  - the browser only ever talks to one address (no CORS needed for
    #    normal use — CORS_ORIGINS on the API is a fallback for anything
    #    hitting it directly, not what the web app itself relies on),
    #  - VITE_API_BASE_URL can stay the relative "/api/v1" baked at build
    #    time, regardless of what public domain this ends up served from.
    # "api" is the API container's service name in
    # infra/docker-compose.prod.yml — Docker Compose's own DNS resolves
    # it inside the shared network.
    location /api/v1/ {
        proxy_pass http://api:3000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
