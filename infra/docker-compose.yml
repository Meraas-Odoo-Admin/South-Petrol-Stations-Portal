name: fuel-tracking-local

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuel_tracking
      POSTGRES_PASSWORD: fuel_tracking
      POSTGRES_DB: fuel_tracking
    ports:
      # Host 5433 -> container 5432: this machine already has a local Postgres
      # bound to 5432, so this project stays off it deliberately.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_tracking -d fuel_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
